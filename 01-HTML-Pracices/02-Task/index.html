<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Internship Registration Form</h1>

    <form style="border: black solid ;">

        <h2>Personal Information</h2>

        <div>
            <label for="name">Name:</label>
            <input type=""  id="name" name="name" required>
        </div>

        <br>

        <div>
            <label for="father">Father's Name:</label>
            <input type="text" id="father" name="father">
        </div>

        <br>

        <div>
            <label for="cnic">CNIC:</label>
            <input type="text" id="cnic" name="cnic"placeholder="12345-1234567-1"pattern="[0-9]{5}-[0-9]{7}-[0-9]{1}">
        </div>

        <br>

        <div>
            <label>Gender:</label>

            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
        </div>

        <br>

        <div>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
        </div>

        <br>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </div>

        <br>

        <div>
            <label for="phone">Mobile Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="03XXXXXXXXX">
        </div>

        <br>

        <div>
            <label for="picture">Upload Picture:</label>
            <input type="file" id="picture" name="picture" accept="image/*">
        </div>

        <h2>Address Information</h2>

        <div>
            <label for="province">Province:</label>
            <select id="province" name="province" required>
                <option value="">Select Province</option>
                <option>Punjab</option>
                <option>Sindh</option>
                <option>Khyber Pakhtunkhwa</option>
                <option>Balochistan</option>
                <option>Islamabad</option>
                <option>Gilgit-Baltistan</option>
                <option>Azad Jammu and Kashmir</option>
            </select>
        </div>

        <br>

        <div>
            <label for="city">City / District:</label>
            <select id="city" name="city">
                <option value="">Select City</option>
                <option>Lahore</option>
                <option>Karachi</option>
                <option>Islamabad</option>
                <option>Rawalpindi</option>
                <option>Gujranwala</option>
                <option>Faisalabad</option>
                <option>Multan</option>
                <option>Peshawar</option>
                <option>Quetta</option>
            </select>
        </div>

        <br>

        <div>
            <label for="address">Complete Address:</label>
            <textarea id="address" name="address" rows="3" cols="25"></textarea>
        </div>

        <h2>Education Information</h2>

        <div>
            <label for="qualification">Qualification:</label>
            <select id="qualification" name="qualification">
                <option value="">Select Qualification</option>
                <option>Matric</option>
                <option>Intermediate</option>
                <option>DAE / Diploma</option>
                <option>BS / Bachelor's</option>
                <option>Master's</option>
            </select>
        </div>

        <br>

        <div>
            <label for="institute">College / University:</label>
            <input type="text" id="institute" name="institute">
        </div>

        <br>

        <div>
            <label for="degree">Degree:</label>
            <input type="text" id="degree" name="degree">
        </div>

        <h2>Internship Information</h2>

        <div>
            <label for="internship">Internship Field:</label>
            <select id="internship" name="internship" required>
                <option value="">Select Field</option>
                <option>Web Development</option>
                <option>Software Engineering</option>
                <option>Graphic Design</option>
                <option>Digital Marketing</option>
                <option>Data Science</option>
                <option>Accounting</option>
            </select>
        </div>

        <br>

        <div>
            <label for="startdate">Start Date:</label>
            <input type="date" id="startdate" name="startdate">
        </div>

        <br>

        <div>
            <label for="duration">Duration:</label>
            <select id="duration" name="duration">
                <option value="1">1 Month</option>
                <option value="2">2 Months</option>
                <option value="3">3 Months</option>
                <option value="6">6 Months</option>
            </select>
        </div>

        <h2>Skills</h2>

        <div>
            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label>
        </div>

        <div>
            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label>
        </div>

        <div>
            <input type="checkbox" id="javascript" name="skills" value="JavaScript">
            <label for="javascript">JavaScript</label>
        </div>

        <div>
            <input type="checkbox" id="python" name="skills" value="Python">
            <label for="python">Python</label>
        </div>

        <div>
            <input type="checkbox" id="office" name="skills" value="MS Office">
            <label for="office">MS Office</label>
        </div>

        <br>

        <div>
            <label for="reason">Why do you want this internship?</label>
            <br>
            <textarea id="reason" name="reason" rows="4" cols="30"></textarea>
        </div>

        <br>

        <div>
            <input type="checkbox" id="confirm" name="confirm" required>
            <label for="confirm">I confirm that my information is correct.</label>
        </div>

        <br>

        <div>
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </div>

    </form>
</body>
</html>
